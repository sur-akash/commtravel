    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The real CommBank diamond, resampled from the source mark into PNGs.
      A webp favicon is unreliable — Chrome would silently fall back to the
      next <link>, which is how a hand-drawn placeholder ended up in the tab.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <title>CommTravel — travel money that tells you what it's doing</title>
    <meta
      name="description"
      content="An unofficial concept prototype of a redesigned CommBank travel portal. Not affiliated with Commonwealth Bank of Australia. All data simulated."
    />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
